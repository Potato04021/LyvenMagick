<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Lyven Magick</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">

<style>
:root{
  --blanco:#f6f2eb;
  --negro:#0b0b0e;
  --dorado:#9c8a54;
}

/* RESET */
*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:'Libre Baskerville', serif;
  color:var(--blanco);
  background:#0b0b0e;
  overflow:hidden;
}

/* ======================
   FONDO ENERGÉTICO
====================== */
.fondo{
  position:fixed;
  top:-20%;
  left:-20%;
  width:140%;
  height:140%;

  background:
    radial-gradient(circle at 30% 40%, rgba(156,138,84,.28), transparent 45%),
    radial-gradient(circle at 70% 60%, rgba(246,242,235,.22), transparent 50%),
    radial-gradient(circle at 50% 20%, rgba(156,138,84,.18), transparent 55%);
  animation:energiaViva 10s infinite linear;
  z-index:-2;
}

@keyframes energiaViva{
  0%{transform:scale(1) translate(0,0)}
  25%{transform:scale(1.15) translate(-40px,30px)}
  50%{transform:scale(1.25) translate(40px,-40px)}
  75%{transform:scale(1.18) translate(-30px,-30px)}
  100%{transform:scale(1.3) translate(30px,40px)}
}

.fondo::after{
  content:"";
  position:absolute;
  inset:0;
  background:url("https://www.transparenttextures.com/patterns/dark-matter.png");
  opacity:.45;
  animation:textura 14s infinite linear;
}

@keyframes textura{
  from{transform:translate(0,0)}
  to{transform:translate(-160px,-160px)}
}

/* ======================
   REVEAL
====================== */
.reveal{
  opacity:0;
  transform:translateY(70px);
  transition:1.4s ease;
}
.reveal.activo{
  opacity:1;
  transform:none;
}

/* ======================
   SECCIONES
====================== */
.section{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:40px 20px;
}

/* ======================
   HERO
====================== */
.hero{
  flex-direction:column;
  text-align:center;
}

.hero h1{
  font-family:'Cinzel', serif;
  font-size:3.8rem;
  letter-spacing:6px;
}

.hero h1::after{
  content:"";
  display:block;
  width:160px;
  height:2px;
  background:var(--blanco);
  margin:32px auto;
}

.hero p{
  max-width:720px;
  font-size:1.1rem;
  opacity:.85;
}

/* ======================
   BLOQUES
====================== */
.bloque{
  max-width:1100px;
  width:100%;
}


.bloque h2{
  font-family:'Cinzel', serif;
  font-size:2.3rem;
  margin-bottom:22px;
}

/* ======================
   COMO TRABAJO
====================== */
.como-trabajo-wrap{
  display:grid;
  grid-template-columns:280px 1fr;
  align-items:start;
  gap:50px;
}



.marco-gato{
  position:relative;
  padding:18px;
  border:1.5px solid rgba(156,138,84,.7);
  background:rgba(0,0,0,.35);
  box-shadow:
    0 0 35px rgba(156,138,84,.25),
    inset 0 0 25px rgba(156,138,84,.15);
}

/* Marco interior */
.marco-gato::before{
  content:"";
  position:absolute;
  inset:6px;
  border:1px solid rgba(246,242,235,.4);
  pointer-events:none;
}

/* Imagen */
.marco-gato img{
  width:100%;
  max-width:240px;
}


.gato{
  width:220px;
  opacity:0;
  transform:translateX(-40px) scale(.9);
  transition:1.4s ease;
}

.gato.activo{
  opacity:1;
  transform:none;
}

.texto-escrito{
  font-size:1rem;
  line-height:1.65;
  opacity:.9;
  max-width:620px;
}


/* ======================
   PORTALES
====================== */
.portales{
  display:flex;
  flex-direction:column;
  gap:50px;
}

.portal{
  border:1.5px solid var(--dorado);
  padding:32px 36px;
  display:grid;
  grid-template-columns:1fr auto;
  align-items:center;
  gap:24px;
}


.portal:hover{
  background:rgba(156,138,84,.18);
  transform:translateX(18px);
}

.portal h3{
  font-size:1.45rem;
}

.portal div{
  min-width:90px;
  text-align:center;
  padding-left:30px;
  letter-spacing:2px;
  opacity:.85;
}


/* ======================
   CONTACTO
====================== */
.contacto{
  text-align:center;
}

.boton{
  margin-top:40px;
  display:inline-block;
  padding:18px 52px;
  border:2px solid var(--dorado);
  text-decoration:none;
  font-family:'Cinzel', serif;
  letter-spacing:2px;
  color:var(--blanco);
  transition:.6s ease;
}

.boton:hover{
  background:var(--dorado);
  color:var(--negro);
}

.contacto{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  gap:22px;
}

.contacto h2{
  font-family:'Cinzel', serif;
  font-size:2.4rem;
  letter-spacing:3px;
}

.contacto p{
  max-width:520px;
  opacity:.85;
  line-height:1.6;
}

.contacto .boton{
  margin-top:20px;
}



/* FOOTER */
footer{
  opacity:.7;
}

/* ======================
   MOBILE – COMO TRABAJO
====================== */
@media (max-width: 768px){
  .como-trabajo-wrap{
    grid-template-columns:1fr;
    justify-items:center;
    text-align:center;
  }

  .texto-escrito{
    max-width:100%;
  }
}

@media (max-width:768px){
  .portal{
    padding:22px 20px;
  }

  .portal h3{
    font-size:1.25rem;
  }
}


</style>
</head>

<body>

<div class="fondo"></div>

<!-- PASO 1 -->
<section class="section hero reveal">
  <h1>Lyven Magick</h1>
  <p>Tarot y trabajos energéticos personalizados.</p>
</section>

<!-- PASO 2 -->
<section class="section reveal">
  <div class="bloque">
    <h2>Cómo trabajo</h2>
    <div class="como-trabajo-wrap">
     <div class="marco-gato">
  <img src="https://i.pinimg.com/736x/88/7d/d3/887dd3576f084446c6a64023cf2ccef4.jpg" class="gato" id="gato">
</div>
      <div class="texto-escrito" id="textoTrabajo"></div>
    </div>
  </div>
</section>

<!-- PASO 3 -->
<section class="section reveal">
  <div class="bloque">
    <h2>Catálogos disponibles</h2>
    <div class="portales">
      <div class="portal" onclick="window.open('https://drive.google.com/file/d/1H5zDBrQR2nptBAeHcDTVg257zDRxQAlX/view?usp=drivesdk')">
        <h3>Catálogo de Rituales</h3>
        <div>ABRIR</div>
      </div>
      <div class="portal" onclick="window.open('https://drive.google.com/file/d/1gE64d9n8kCY5CE5K_YVuC_WJfwyu21EK/view?usp=drive_link')">
        <h3>Catálogo de Lecturas</h3>
        <div>ABRIR</div>
      </div>
    </div>
  </div>
</section>

<!-- PASO 4 -->
<section class="section contacto reveal">
  <h2>Contacto</h2>
  <p>Si sientes el llamado, contáctame directamente.</p>
  <a class="boton" href="https://ig.me/m/Lyven.zl" target="_blank">CONTACTAR</a>
</section>


<script>
/* REVEAL */
const observer=new IntersectionObserver(entries=>{
  entries.forEach(e=>{
    e.target.classList.toggle("activo", e.isIntersecting);
  });
},{threshold:.4});
document.querySelectorAll(".reveal").forEach(el=>observer.observe(el));

/* SCROLL POR PASOS */
const sections=[...document.querySelectorAll(".section")];
let index=0, lock=false;

function ir(i){
  if(i<0||i>=sections.length) return;
  lock=true;
  sections[i].scrollIntoView({behavior:"smooth"});
  setTimeout(()=>lock=false,1500);
}

window.addEventListener("wheel",e=>{
  if(lock) return;
  index += e.deltaY>0 ? 1 : -1;
  index=Math.max(0,Math.min(index,sections.length-1));
  ir(index);
  e.preventDefault();
},{passive:false});

/* TEXTO ESCRITO + GATO */
const texto = `Mi trabajo, tanto en lecturas de tarot como en procesos energéticos, es totalmente personalizado. Para orientarte correctamente, necesito que al escribirme seas clar@ y direct@. Cuéntame brevemente tu situación y, si hay otra persona involucrada, cómo está la relación. En el tarot, solo requiero un contexto corto y tu pregunta clara. Con esta información puedo indicarte el trabajo más adecuado. Respondo en orden, por lo que te pido paciencia y que envíes todo en un solo mensaje. Las dudas generales las respondo en dinámicas de historias.`;

let pos=0, escrito=false;

const obsTexto=new IntersectionObserver(e=>{
  if(e[0].isIntersecting && !escrito){
    escrito=true;
    document.getElementById("gato").classList.add("activo");
    const int=setInterval(()=>{
      document.getElementById("textoTrabajo").textContent+=texto.charAt(pos);
      pos++;
      if(pos>=texto.length) clearInterval(int);
    },35);
  }
},{threshold:.6});

obsTexto.observe(document.querySelectorAll(".section")[1]);

/* MÓVIL NORMAL */
if("ontouchstart" in window){
  document.body.style.overflow="auto";
}
</script>

</body>
</html>
